[project]
name = "job-hunt-pipeline-backend"
version = "2.0.0"
description = "FastAPI Backend for Job Hunt Pipeline - Personal Job Search & Career Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.3",
    "httpx>=0.27.2",
    "beautifulsoup4>=4.12.3",
    "selectolax>=0.3.21",
    "python-dotenv>=1.0.1",
    "google-genai>=0.1.1",
    "openai>=1.50.0",
    "greenlet>=3.0.0",
    "pypdf>=5.0.0",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "python-multipart>=0.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["..", "."]

[tool.hatch.build.targets.wheel]
packages = ["app"]

